name: Validate website
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:seo
      - name: Validate future release SEO without deploying
        run: SITE_INDEXABLE=true npm run build && SITE_INDEXABLE=true npm run verify:seo
